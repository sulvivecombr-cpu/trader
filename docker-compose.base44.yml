services:
  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3000
      - FLASK_DEBUG=true
      - PYTHONUNBUFFERED=1
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec flask --app dashboard.app:app run --debug --host 0.0.0.0 --port 3000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/auth/login', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure
